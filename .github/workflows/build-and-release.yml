name: Build & Release ALR VOICE COLOR

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Visual Studio 2022 x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3, Standalone & DSP Tests (Release)
        run: cmake --build build --config Release --parallel

      - name: Run 20-Test C++20 DSP Verification Suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows Plugin Bundle
        shell: pwsh
        run: |
          $pkg = "dist/ALR-VOICE-COLOR-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$pkg/VST3", "$pkg/Standalone" | Out-Null

          $vst3 = Get-ChildItem -Path "build" -Filter "*.vst3" -Recurse | Select-Object -First 1
          $exe  = Get-ChildItem -Path "build" -Filter "ALR VOICE COLOR.exe" -Recurse | Select-Object -First 1

          if (-not $vst3) { throw "VST3 bundle not found!" }
          Copy-Item -Path $vst3.FullName -Destination "$pkg/VST3/" -Recurse -Force
          if ($exe) {
            Copy-Item -Path $exe.FullName -Destination "$pkg/Standalone/" -Force
          }

          @(
            "ALR VOICE COLOR - Instalacion en Windows (VST3 + Standalone)"
            "============================================================"
            "1. Copia la carpeta 'VST3\ALR VOICE COLOR.vst3' dentro de:"
            "   C:\Program Files\Common Files\VST3\"
            "2. Abre tu DAW (FL Studio, Ableton Live, Cubase, Reaper, Studio One)"
            "   y ejecuta un escaneo de plugins (Manage Plugins -> Find installed plugins)."
            "3. Para probar sin DAW, ejecuta 'Standalone\ALR VOICE COLOR.exe'."
          ) | Set-Content -Path "$pkg/INSTALAR_WINDOWS.txt" -Encoding UTF8

          Compress-Archive -Path "$pkg/*" -DestinationPath "dist/ALR-VOICE-COLOR-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALR-VOICE-COLOR-Windows-x64
          path: dist/ALR-VOICE-COLOR-Windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: macOS Universal (VST3 + AU + Standalone)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Universal arm64 + x86_64)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3, AU, Standalone & DSP Tests (Release)
        run: cmake --build build --config Release --parallel

      - name: Run 20-Test C++20 DSP Verification Suite
        run: ctest --test-dir build --output-on-failure

      - name: Ad-hoc Sign & Package macOS Plugin Bundle
        shell: bash
        run: |
          mkdir -p dist/ALR-VOICE-COLOR-macOS-Universal/{VST3,AU,Standalone}

          VST3_PATH=$(find build -maxdepth 5 -name "*.vst3" -type d | head -n 1)
          AU_PATH=$(find build -maxdepth 5 -name "*.component" -type d | head -n 1)
          APP_PATH=$(find build -maxdepth 5 -name "*.app" -type d | head -n 1)

          if [ -z "$VST3_PATH" ] || [ -z "$AU_PATH" ]; then
            echo "Error: VST3 or AU bundle missing!"
            exit 1
          fi

          codesign --force --deep --sign - "$VST3_PATH"
          codesign --force --deep --sign - "$AU_PATH"
          cp -R "$VST3_PATH" dist/ALR-VOICE-COLOR-macOS-Universal/VST3/
          cp -R "$AU_PATH"   dist/ALR-VOICE-COLOR-macOS-Universal/AU/

          if [ -n "$APP_PATH" ]; then
            codesign --force --deep --sign - "$APP_PATH"
            cp -R "$APP_PATH" dist/ALR-VOICE-COLOR-macOS-Universal/Standalone/
          fi

          printf '%s\n' \
            "ALR VOICE COLOR - Instalacion en macOS (Apple Silicon & Intel)" \
            "==============================================================" \
            "1. VST3: Copia 'VST3/ALR VOICE COLOR.vst3' a:" \
            "   ~/Library/Audio/Plug-Ins/VST3/" \
            "2. Audio Unit (Logic Pro / GarageBand): Copia 'AU/ALR VOICE COLOR.component' a:" \
            "   ~/Library/Audio/Plug-Ins/Components/" \
            "3. Si macOS muestra aviso de desarrollador no verificado, ejecuta en Terminal:" \
            "   xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/\"ALR VOICE COLOR.vst3\"" \
            "   xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/\"ALR VOICE COLOR.component\"" \
            "4. Reescanea los plugins en tu DAW." \
            > dist/ALR-VOICE-COLOR-macOS-Universal/INSTALAR_MACOS.txt

          (cd dist/ALR-VOICE-COLOR-macOS-Universal && zip -r ../ALR-VOICE-COLOR-macOS-Universal.zip .)

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALR-VOICE-COLOR-macOS-Universal
          path: dist/ALR-VOICE-COLOR-macOS-Universal.zip
          if-no-files-found: error

  build-linux:
    name: Linux x64 (VST3 + Standalone)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JUCE Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Configure CMake (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, Standalone & DSP Tests (Release)
        run: cmake --build build --config Release --parallel

      - name: Run 20-Test C++20 DSP Verification Suite
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux Plugin Bundle
        shell: bash
        run: |
          mkdir -p dist/ALR-VOICE-COLOR-Linux-x64/{VST3,Standalone}

          VST3_PATH=$(find build -maxdepth 5 -name "*.vst3" -type d | head -n 1)
          STANDALONE_BIN=$(find build -path "*/Standalone/*" -type f -executable | head -n 1)

          if [ -z "$VST3_PATH" ]; then
            echo "Error: VST3 bundle missing!"
            exit 1
          fi

          cp -R "$VST3_PATH" dist/ALR-VOICE-COLOR-Linux-x64/VST3/
          if [ -n "$STANDALONE_BIN" ]; then
            cp "$STANDALONE_BIN" dist/ALR-VOICE-COLOR-Linux-x64/Standalone/
          fi

          printf '%s\n' \
            "ALR VOICE COLOR - Instalacion en Linux x64 (VST3 + Standalone)" \
            "==============================================================" \
            "1. Copia 'VST3/ALR VOICE COLOR.vst3' dentro de:" \
            "   ~/.vst3/" \
            "2. Reescanea los plugins en Reaper, Bitwig, Ardour o tu DAW favorito." \
            > dist/ALR-VOICE-COLOR-Linux-x64/INSTALAR_LINUX.txt

          (cd dist/ALR-VOICE-COLOR-Linux-x64 && zip -r ../ALR-VOICE-COLOR-Linux-x64.zip .)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALR-VOICE-COLOR-Linux-x64
          path: dist/ALR-VOICE-COLOR-Linux-x64.zip
          if-no-files-found: error

  publish-release:
    name: Publish Downloadable GitHub Release
    needs: [ build-windows, build-macos, build-linux ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: rel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "name=ALR VOICE COLOR ${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=ALR VOICE COLOR - Latest Build (VST3 / AU / Standalone)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release with Compiled Plugins
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          make_latest: true
          body: |
            ## ALR VOICE COLOR — Plugins Compilados Listos para Usar

            Descarga el archivo correspondiente a tu sistema operativo desde **Assets** abajo:

            - **Windows (FL Studio, Ableton, Cubase, Reaper, Studio One):** `ALR-VOICE-COLOR-Windows-x64.zip` (`VST3` + `Standalone`)
            - **macOS (Apple Silicon & Intel — Logic Pro, Ableton, FL Studio):** `ALR-VOICE-COLOR-macOS-Universal.zip` (`VST3` + `AU` + `Standalone`)
            - **Linux x64:** `ALR-VOICE-COLOR-Linux-x64.zip` (`VST3` + `Standalone`)

            Cada paquete incluye instrucciones rapidas de instalacion y paso las 20 pruebas automatizadas del motor DSP C++20.
          files: |
            release-assets/ALR-VOICE-COLOR-Windows-x64.zip
            release-assets/ALR-VOICE-COLOR-macOS-Universal.zip
            release-assets/ALR-VOICE-COLOR-Linux-x64.zip
